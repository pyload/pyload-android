plugins {
    id 'com.android.application'
    id 'org.openapi.generator' version '7.23.0'
//    id "com.autonomousapps.dependency-analysis" version '3.16.0'
//    id 'com.github.ben-manes.versions' version '0.54.0'
}

def getGitHash = {
    try {
        def head = file('../.git/HEAD').text.trim()
        if (head.startsWith('ref: ')) {
            def refPath = head.substring(5)
            def refFile = file("../.git/${refPath}")
            if (refFile.exists()) {
                return refFile.text.trim().substring(0, 7)
            }
            // If ref file doesn't exist, it might be in packed-refs
            def packedRefs = file('../.git/packed-refs')
            if (packedRefs.exists()) {
                def line = packedRefs.readLines().find { it.endsWith(refPath) }
                if (line) {
                    return line.split(' ')[0].substring(0, 7)
                }
            }
            return "unknown"
        }
        return head.substring(0, 7)
    } catch (Exception ignored) {
        return "unknown"
    }
}

android {
    compileSdk = 35

    namespace = 'org.pyload.android.client'

    defaultConfig {
        applicationId = "org.pyload.android.client"
        minSdk = 21
        targetSdk = 35
        versionCode = 24
        versionName = "v0.4.2"

        buildConfigField "String", "GIT_COMMIT", "\"${getGitHash()}\""
        buildConfigField "String", "BUILD_DATE", "\"${new java.text.SimpleDateFormat("dd-MMM-yyyy HH:mm:ss", java.util.Locale.US).format(new java.util.Date())}\""
    }

    buildFeatures {
        buildConfig = true
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
        }
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs += ["-Xlint:unchecked", "-Xlint:deprecation"]
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }
}

ext {
    openapiSpecUrl = "https://raw.githubusercontent.com/pyload/pyload/refs/heads/main/openapi-generator/openapi.json"

    openapiResourcesDir = "$projectDir/src/main/resources/openapi"
    openapiLocalSpecFile = "${openapiResourcesDir}/openapi.json"
    openapiIgnoreFileOverride = "${openapiResourcesDir}/.openapi-generator-ignore"

    openapiGenaratedRoot = "$projectDir/build/generated/openapi"
    openapiGenaratedApiClientDir = "${openapiGenaratedRoot}/src/main/java/org/pyload/android/openapi"
    openapiProjectApiClientDir = "$projectDir/src/main/java/org/pyload/android/openapi"
}

openApiGenerate {
    generatorName = "java"
    inputSpec = openapiLocalSpecFile
    outputDir = openapiGenaratedRoot

    invokerPackage = "org.pyload.android.openapi"
    apiPackage     = "org.pyload.android.openapi.api"
    modelPackage   = "org.pyload.android.openapi.model"

//    library = "okhttp-gson"
    library = "retrofit2"

    groupId = "org.pyload.android"

    configOptions = [
            additionalModelTypeAnnotations: "@SuppressWarnings(\"unchecked\")",
            additionalEnumTypeAnnotations: "@SuppressWarnings(\"unchecked\")",
            additionalApiTypeAnnotations: "@SuppressWarnings(\"unchecked\")"
    ]

    additionalProperties = [
            parcelableModel: "true",
            openApiNullable: "false",
            hideGenerationTimestamp: "true"
    ]

    ignoreFileOverride = openapiIgnoreFileOverride
    skipOverwrite = false
    templateDir = "$projectDir/src/main/resources/openapi"
}

tasks.register('downloadOpenApiSpec') {
    def localSpecFile = file(openapiLocalSpecFile)

    outputs.file(localSpecFile)
    outputs.upToDateWhen { false } // Always check

    doLast {
        println "Checking OpenAPI spec from pyLoad's GitHub repository..."

        try {
            def connection = new URL(openapiSpecUrl).openConnection() as HttpURLConnection
            connection.connectTimeout = 15000   // 15 seconds
            connection.readTimeout = 30000      // 30 seconds
            connection.requestMethod = "GET"

            if (connection.responseCode != HttpURLConnection.HTTP_OK) {
                throw new GradleException("Failed to download spec. HTTP ${connection.responseCode}: ${connection.responseMessage}")
            }

            def remoteBytes = connection.inputStream.bytes
            // Compare with local file
            if (localSpecFile.exists()) {
                def localBytes = localSpecFile.bytes

                if (java.util.Arrays.equals(remoteBytes, localBytes)) {
                    println "✅ Local openapi.json is up-to-date"
                    return
                } else {
                    println "🔄 Remote OpenAPI spec has changed. Updating local file..."
                }
            } else {
                println "📥 Local openapi.json file not found. Downloading..."
            }

            // Save new version
            localSpecFile.parentFile.mkdirs()
            localSpecFile.bytes = remoteBytes
            println "✅ Successfully updated openapi.json"

            project.ext.openapiSpecChanged = true

        } catch (UnknownHostException e) {
            throw new GradleException("Network error: Cannot reach server. Check your internet connection.", e)
        } catch (SocketTimeoutException e) {
            throw new GradleException("Timeout downloading spec. Server is slow or unreachable.", e)
        } catch (Exception e) {
            throw new GradleException("Failed to download OpenAPI spec from ${openapiSpecUrl}", e)
        }
    }
}

tasks.register('moveOpenApiCode') {
    dependsOn "openApiGenerate"

    inputs.file(openapiLocalSpecFile)
    inputs.dir(openapiGenaratedRoot)
    outputs.dir(openapiProjectApiClientDir)

    onlyIf {
        def shouldRun = tasks.named('openApiGenerate').get().state.didWork
        if (shouldRun) {
            println "→ moveOpenApiCode will run because openApiGenerate executed"
        } else {
            println "→ Skipping moveOpenApiCode (openApiGenerate was up-to-date)"
        }
        return shouldRun
    }

    doLast {
        def sourceDir = file(openapiGenaratedApiClientDir)
        def targetDir = file(openapiProjectApiClientDir)

        println "Moving generated code to src/main/java..."

        // Delete old directory if it exists
        if (targetDir.exists()) {
            targetDir.deleteDir()
            println "Deleted old directory"
        }

        if (!sourceDir.exists() || sourceDir.listFiles()?.size() == 0) {
            throw new GradleException("""
                Failed to move OpenAPI code!
                
                Expected source: ${sourceDir.absolutePath}
                This usually means openApiGenerate did not produce any files.
                Try running: ./gradlew forceGenerateOpenApi
            """.stripIndent())
        } else {
            // Move new generated code
            sourceDir.parentFile.mkdirs()
            sourceDir.renameTo(targetDir)

            // Post-processing: Suppress warnings in ApiClient.java
            def apiClientFile = new File(targetDir, "ApiClient.java")
            if (apiClientFile.exists()) {
                println "Applying warning suppressions to ApiClient.java..."
                def content = apiClientFile.text
                content = content.replace("public class ApiClient", "@SuppressWarnings(\"unchecked\")\npublic class ApiClient")
                content = content.replace("class GsonResponseBodyConverterToString", "@SuppressWarnings(\"unchecked\")\nclass GsonResponseBodyConverterToString")
                apiClientFile.text = content
            }

            println "✅ Successfully moved generated code to src/main/java/org/pyload/android/openapi"
        }
    }
}

tasks.register('forceGenerateOpenApi') {
    description = "Force regenerate OpenAPI client (ignores incremental checks)"

    doFirst {
        println "🔄 Forcing full OpenAPI regeneration..."
        file(openapiLocalSpecFile).deleteDir()
        file(openapiProjectApiClientDir).deleteDir()
        file(openapiGenaratedRoot).deleteDir()
    }
    finalizedBy "openApiGenerate"
}

tasks.named('preBuild') {
    dependsOn "moveOpenApiCode"
}

tasks.named('openApiGenerate') {
    dependsOn 'downloadOpenApiSpec'
    finalizedBy 'moveOpenApiCode'

    onlyIf {
        def targetDir = file(openapiProjectApiClientDir)
        def specChanged = project.findProperty('openapiSpecChanged') == true

        def shouldRun = specChanged || !targetDir.exists() || (targetDir.listFiles()?.length ?: 0) == 0

        if (!shouldRun) {
            println "→ Skipping openApiGenerate (target already exists and spec unchanged)"
            println "Use ./gradlew forceGenerateOpenApi to force regenerate"
            return false
        } else {
            println "→ Running openApiGenerate (spec changed or target directory is empty or missing)"
            return true
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.11.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'io.gsonfire:gson-fire:1.9.0'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.0'
}
